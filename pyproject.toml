[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-preflight"
version = "0.1.4"
description = "Read-only Git integration preflight and repository governance CLI"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Kaan081"}
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
preflight = "preflight.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
